<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css" />
    <title>New World Clock</title>
</head>

<body>
    <div class="container">
        <h1>Antje's World Clock</h1>
        <select>
            <option value="">Select a city...</option>
            <option value="">London</option>
            <option value="">New York</option>
            <option value="">Auckland</option>
        </select>

        <div class="city">
            <h2>Los Angeles</h2>
            <div class="date">May 3rd 2026</div>
            <div class="time">7:31:48 PM</div>
        </div>
        <div class="city">
            <h2>Sydney</h2>
            <div class="date">May 3rd 2026</div>
            <div class="time">7:31:48 PM</div>
        </div>
    </div>
    <footer>
        This project was coded by <a href="https://github.com/antjekunert4-png" target="_blank">Antje Kunert</a> and is
        <a href="https://github.com/antjekunert4-png/World_clock_2" target="_blank">open-sourced on GitHub</a> and is
        <a href="https://new-world-clock2.netlify.app/" target="_blank">hosted on Netlify</a>.
    </footer>
    <script src="javascript/index.js"></script>
</body>

</html>
